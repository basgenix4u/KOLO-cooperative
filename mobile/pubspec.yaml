name: kolo
description: "KOLO — savings groups, made trustworthy."
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutter 3.50 / Dart 3.14 is the baseline this app targets: it is what the
  # redesign was built and verified against, and the Material 3.27+ theme API
  # (CardThemeData, DialogThemeData, TabBarThemeData, Color.withValues) is used
  # throughout. Older SDKs are not supported.
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State and routing: deliberately small. This app has one job per screen.
  flutter_riverpod: ^3.0.0
  go_router: ^14.2.7

  # HTTP, storage and secure token handling.
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.2

  # Intl for money formatting; every amount is integer minor units.
  intl: ^0.19.0

  # Deep links: an invitation or a payment link opens the app rather than a
  # browser. Pinned instead of hand-written platform plumbing so iOS and Android
  # behave the same way.
  app_links: ^6.3.2

  # Charts on the group dashboard.
  fl_chart: ^0.69.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
